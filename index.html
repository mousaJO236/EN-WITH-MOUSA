    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], arabic: ['Noto Naskh Arabic',

                        'float': 'float 6s ease-in-out infinite',

                        'node-expand': 'nodeExpand 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)',

                        'pulse-soft': 'pulseSoft 2s ease-in-out infinite',

                    keyframes: {
                        float: { '0%, 100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-20px)' } },

                        ripple: { '0%': { transform: 'scale(0)', opacity: '1' }, '100%': { transform: 'scale(4)',
                                opacity: '0' } },
                        nodeExpand: { '0%': { transform: 'scale(0) rotate(-10deg)', opacity: '0' },
                            '100%': { transform: 'scale(1) rotate(0deg)', opacity: '1' } },
                        fadeInUp: { '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' } },
                        pulseSoft: { '0%, 100%': { transform: 'scale(1)' }, '50%': { transform: 'scale(1.03)' } },
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: rgba(0, 0, 0, 0.1);
        }
        .dark {
            --glass-bg: rgba(30, 30, 50, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: rgba(0, 0, 0, 0.3);
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--glass-shadow);
        }
        .glass-strong {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 40px var(--glass-shadow);
        }
        .neumorph {
            background: linear-gradient(145deg, #e8ecf1, #ffffff);
            box-shadow: 8px 8px 16px #d1d5db, -8px -8px 16px #ffffff;
        }
        .dark .neumorph {
            background: linear-gradient(145deg, #1e293b, #334155);
            box-shadow: 8px 8px 16px #0f172a, -8px -8px 16px #3b4f6b;
        }
        .gradient-text {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: gradientShift 3s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% center;
            }
            50% {
                background-position: 200% center;
            }
        }
        .card-hover {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-hover:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 25px 50px rgba(139, 92, 246, 0.3);
        }
        .mindmap-line {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 0.8s ease-out forwards;
        }
        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }
        .node-enter {
            animation: nodeExpand 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            animation: particleFloat linear infinite;
            opacity: 0.3;
        }
        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) rotate(720deg);
                opacity: 0;
            }
        }
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.4);
            border-radius: 10px;
        }
        .mindmap-container {
            perspective: 1000px;
        }
        .mindmap-node {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .mindmap-node:hover {
            transform: scale(1.08);
            z-index: 10;
        }
        .mindmap-node.expanded {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.5);
        }
        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.15);
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
            }
        }
        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

</head>

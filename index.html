<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Preposition Quiz Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4f8; }
    .card { background: white; padding: 20px; border-radius: 12px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { display: block; width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; cursor: pointer; background: #fff; text-align: right; }
    button:hover { background: #eef2ff; }
    .correct { color: green; font-weight: bold; }
    .wrong { color: red; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>📝 اختبار حروف الجر (تجربة)</h2>
  <div id="quizContainer"></div>
</div>

<script>
  const quizData = [
    { question: "I'll meet you ___ the bus stop.", options: ["at", "in", "on"], correct: 0, explanation: "نستخدم AT مع النقاط والأماكن المحددة." },
    { question: "She lives ___ New York.", options: ["at", "in", "on"], correct: 1, explanation: "نستخدم IN مع المدن والدول." }
  ];

  let currentQ = 0;
  let score = 0;

  function loadQuestion() {
    if (currentQ >= quizData.length) {
      document.getElementById('quizContainer').innerHTML = `
        <h3>🎉 اكتمل الاختبار!</h3>
        <p>النتيجة النهائية: ${score} من ${quizData.length}</p>
        <button onclick="restart()">إعادة الاختبار</button>
      `;
      return;
    }

    const q = quizData[currentQ];
    let html = `<p><b>سؤال ${currentQ + 1}:</b> ${q.question}</p>`;
    q.options.forEach((opt, idx) => {
      html += `<button onclick="checkAnswer(${idx})">${opt}</button>`;
    });
    html += `<div id="feedback" style="margin-top:10px;"></div>`;
    document.getElementById('quizContainer').innerHTML = html;
  }

  function checkAnswer(selected) {
    const q = quizData[currentQ];
    const feedback = document.getElementById('feedback');
    if (selected === q.correct) {
      score++;
      feedback.innerHTML = `<span class="correct">✅ إجابة صحيحة!</span><br><small>${q.explanation}</small>`;
    } else {
      feedback.innerHTML = `<span class="wrong">❌ إجابة خاطئة!</span>`;
    }

    setTimeout(() => {
      currentQ++;
      loadQuestion();
    }, 1200);
  }

  function restart() {
    currentQ = 0;
    score = 0;
    loadQuestion();
  }

  loadQuestion();
</script>

</body>
</html>

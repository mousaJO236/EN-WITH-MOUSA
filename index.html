<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrepositionMaster · Interactive Grammar Mind Maps</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], arabic: ['Noto Naskh Arabic', 'serif'] },
                    animation: {
                        float: 'float 6s ease-in-out infinite',
                        glow: 'glow 2s ease-in-out infinite alternate',
                        nodeExpand: 'nodeExpand 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)',
                        fadeInUp: 'fadeInUp 0.6s ease-out',
                        pulseSoft: 'pulseSoft 2s ease-in-out infinite',
                        shimmer: 'shimmer 3s ease-in-out infinite',
                        breathe: 'breathe 4s ease-in-out infinite',
                        slideUp: 'slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)',
                        scaleIn: 'scaleIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)',
                        floatGlow: 'floatGlow 5s ease-in-out infinite',
                    },
                    keyframes: {
                        float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-20px)' } },
                        glow: { '0%': { boxShadow: '0 0 20px rgba(139,92,246,0.2)' }, '100%': { boxShadow: '0 0 50px rgba(139,92,246,0.6)' } },
                        nodeExpand: { '0%': { transform: 'scale(0) rotate(-8deg)', opacity: '0' }, '100%': { transform: 'scale(1) rotate(0deg)', opacity: '1' } },
                        fadeInUp: { '0%': { transform: 'translateY(40px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        pulseSoft: { '0%,100%': { transform: 'scale(1)' }, '50%': { transform: 'scale(1.04)' } },
                        shimmer: { '0%': { backgroundPosition: '-200% center' }, '100%': { backgroundPosition: '200% center' } },
                        breathe: { '0%,100%': { opacity: '0.6' }, '50%': { opacity: '1' } },
                        slideUp: { '0%': { transform: 'translateY(30px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
                        scaleIn: { '0%': { transform: 'scale(0.8)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        floatGlow: { '0%,100%': { transform: 'translateY(0px) scale(1)', filter: 'brightness(1)' }, '50%': { transform: 'translateY(-10px) scale(1.02)', filter: 'brightness(1.1)' } },
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ─── Root variables ─── */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.20);
            --glass-shadow: rgba(0, 0, 0, 0.08);
            --bg-start: #f8fafc;
            --bg-end: #f0f4ff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            --glow-purple: rgba(139, 92, 246, 0.15);
        }
        .dark {
            --glass-bg: rgba(15, 23, 42, 0.50);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-shadow: rgba(0, 0, 0, 0.40);
            --bg-start: #0f172a;
            --bg-end: #1e1b4b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.40);
            --glow-purple: rgba(139, 92, 246, 0.25);
        }

        /* ─── Glass morphism ─── */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(1.2);
            -webkit-backdrop-filter: blur(20px) saturate(1.2);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px var(--glass-shadow);
        }
        .glass-strong {
            background: var(--glass-bg);
            backdrop-filter: blur(30px) saturate(1.4);
            -webkit-backdrop-filter: blur(30px) saturate(1.4);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 48px var(--glass-shadow);
        }

        /* ─── Gradient text ─── */
        .gradient-text {
            background: linear-gradient(135deg, #8b5cf6, #06b6d4, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% auto;
            animation: gradientShift 4s ease-in-out infinite;
        }
        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% center;
            }
            50% {
                background-position: 200% center;
            }
        }

        /* ─── Cards ─── */
        .card-hover {
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, box-shadow;
        }
        .card-hover:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 30px 60px var(--glow-purple);
        }

        /* ─── Mind map nodes ─── */
        .mindmap-node {
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            will-change: transform;
        }
        .mindmap-node:hover {
            transform: scale(1.08) translateY(-4px);
            z-index: 10;
            filter: brightness(1.05);
        }
        .mindmap-node.expanded {
            transform: scale(1.04);
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.35);
        }

        /* ─── Node enter animation ─── */
        .node-enter {
            animation: nodeExpand 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        .bounce-in {
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes bounceIn {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            50% {
                transform: scale(1.10);
                opacity: 1;
            }
            70% {
                transform: scale(0.95);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ─── Scrollbar ─── */
        .scrollbar-thin::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.35);
            border-radius: 12px;
        }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background: rgba(139, 92, 246, 0.6);
        }

        /* ─── Particles ─── */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            opacity: 0.25;
            will-change: transform;
        }
        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            15% {
                opacity: 0.5;
            }
            85% {
                opacity: 0.4;
            }
            100% {
                transform: translateY(-120px) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* ─── Line drawing for mind map ─── */
        .mindmap-line {
            stroke-dasharray: 1200;
            stroke-dashoffset: 1200;
            animation: drawLine 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes drawLine {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* ─── Background glow orbs ─── */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            will-change: transform;
        }
        .dark .orb {
            opacity: 0.20;
        }

        /* ─── Search results ─── */
        .search-result-item {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .search-result-item:hover {
            background: rgba(139, 92, 246, 0.10);
            padding-left: 0.75rem;
        }
        .dark .search-result-item:hover {
            background: rgba(139, 92, 246, 0.18);
        }

        /* ─── Responsive tweaks ─── */
        @media (max-width: 640px) {
            .glass-strong {
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }
        }

        /* ─── Loading shimmer ─── */
        .shimmer-bg {
            background: linear-gradient(90deg, transparent 30%, rgba(139, 92, 246, 0.08) 50%, transparent 70%);
            background-size: 200% 100%;
            animation: shimmer 2.5s ease-in-out infinite;
        }

        /* ─── Flashcard flip ─── */
        .flashcard-inner {
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }
        .flashcard-inner.flipped {
            transform: rotateY(180deg);
        }
        .flashcard-front,
        .flashcard-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }

        /* ─── Smooth page transitions ─── */
        .page-transition {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .page-enter {
            opacity: 0;
            transform: translateY(20px);
        }
        .page-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[var(--bg-start)] via-purple-50/30 to-[var(--bg-end)] dark:from-[var(--bg-start)] dark:via-purple-950/20 dark:to-[var(--bg-end)] min-h-screen transition-colors duration-700 font-sans overflow-x-hidden antialiased">

    <!-- ─── Background Orbs ─── -->
    <div class="orb w-[40rem] h-[40rem] -top-20 -left-20 bg-purple-400/30 dark:bg-purple-600/20 animate-breathe"></div>
    <div class="orb w-[50rem] h-[50rem] bottom-0 -right-32 bg-cyan-400/25 dark:bg-cyan-600/15 animate-breathe" style="animation-delay:2s;"></div>
    <div class="orb w-[30rem] h-[30rem] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-indigo-400/15 dark:bg-indigo-500/10 animate-breathe" style="animation-delay:4s;"></div>

    <!-- ─── Particle Container ─── -->
    <div id="particles" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- ─── App ─── -->
    <div id="app" class="relative z-10">

        <!-- ─── Header ─── -->
        <header class="glass-strong sticky top-3 z-50 mx-3 mt-3 rounded-3xl px-4 md:px-6 py-3 flex items-center justify-between flex-wrap gap-2 transition-all duration-500">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-purple-500/30 float-glow">P</div>
                <h1 class="text-xl md:text-2xl font-extrabold gradient-text tracking-tight">PrepositionMaster</h1>
            </div>
            <div class="flex items-center gap-1.5 flex-wrap">

                <!-- Search -->
                <div class="relative group">
                    <input type="text" id="searchInput" placeholder="Search topics…" class="w-36 md:w-52 px-4 py-2.5 rounded-2xl bg-white/50 dark:bg-slate-800/50 backdrop-blur-md border border-purple-200/60 dark:border-purple-800/40 focus:border-purple-500 focus:ring-2 focus:ring-purple-400/50 outline-none transition-all duration-300 text-sm dark:text-white dark:placeholder-gray-400" oninput="handleSearch(this.value)" />
                    <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-purple-400/70 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <div id="searchResults" class="absolute top-full mt-2 w-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-purple-100/50 dark:border-purple-900/50 hidden max-h-64 overflow-y-auto scrollbar-thin z-50 text-sm"></div>
                </div>

                <!-- Lang Toggle -->
                <button onclick="toggleLanguage()" class="px-3.5 py-2.5 rounded-2xl bg-white/50 dark:bg-slate-800/50 backdrop-blur-md border border-purple-200/60 dark:border-purple-800/40 hover:border-purple-500 transition-all duration-300 text-sm font-medium flex items-center gap-1.5 dark:text-white" id="langBtn">
                    <span id="langIcon">🇬🇧</span><span id="langText">EN</span>
                </button>

                <!-- Dark Mode Toggle -->
                <button onclick="toggleDarkMode()" class="px-3.5 py-2.5 rounded-2xl bg-white/50 dark:bg-slate-800/50 backdrop-blur-md border border-purple-200/60 dark:border-purple-800/40 hover:border-purple-500 transition-all duration-300 text-sm font-medium dark:text-white flex items-center gap-1.5" id="darkBtn">
                    <span id="darkIcon">🌙</span><span id="darkText">Dark</span>
                </button>

                <!-- Font Size -->
                <button onclick="toggleFontSize()" class="px-3 py-2.5 rounded-2xl bg-white/50 dark:bg-slate-800/50 backdrop-blur-md border border-purple-200/60 dark:border-purple-800/40 hover:border-purple-500 transition-all duration-300 text-sm font-medium dark:text-white" title="Toggle font size">Aa</button>
            </div>
        </header>

        <!-- ─── Breadcrumb ─── -->
        <nav id="breadcrumb" class="mx-4 md:mx-6 mt-4 flex items-center gap-2 text-sm text-purple-600 dark:text-purple-400 flex-wrap transition-all duration-300">
            <span class="cursor-pointer hover:underline font-medium" onclick="navigateHome()">🏠 Home</span>
            <span id="breadcrumbPath" class="text-gray-400 dark:text-gray-500"></span>
        </nav>

        <!-- ─── Main ─── -->
        <main id="mainContent" class="px-3 md:px-6 py-5 transition-all duration-500">

            <!-- ─── Homepage ─── -->
            <div id="homepageView" class="space-y-7">
                <div class="text-center mb-6 animate-fadeInUp">
                    <h2 class="text-3xl md:text-5xl font-black gradient-text mb-3 leading-tight">Master English Prepositions</h2>
                    <p class="text-gray-500 dark:text-gray-400 text-lg md:text-xl max-w-2xl mx-auto">Tap any card to explore an interactive mind map with examples, quizzes &amp; bilingual explanations</p>
                </div>

                <!-- Stats -->
                <div class="flex justify-center gap-3 flex-wrap" id="statsBar">
                    <div class="glass rounded-2xl px-5 py-3 text-center transition-all hover:scale-105 duration-300"><div class="text-2xl font-bold text-purple-600" id="lessonsCompleted">0</div><div class="text-xs text-gray-500 uppercase tracking-wide">Completed</div></div>
                    <div class="glass rounded-2xl px-5 py-3 text-center transition-all hover:scale-105 duration-300"><div class="text-2xl font-bold text-cyan-600" id="totalScore">0</div><div class="text-xs text-gray-500 uppercase tracking-wide">Score</div></div>
                    <div class="glass rounded-2xl px-5 py-3 text-center transition-all hover:scale-105 duration-300"><div class="text-2xl font-bold text-emerald-600" id="streakDays">0</div><div class="text-xs text-gray-500 uppercase tracking-wide">Day Streak</div></div>
                </div>

                <!-- Cards Grid -->
                <div id="cardsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 md:gap-4"></div>
            </div>

            <!-- ─── Mind Map Detail ─── -->
            <div id="mindmapView" class="hidden transition-all duration-700">
                <div class="flex items-center gap-3 mb-5 flex-wrap">
                    <button onclick="navigateHome()" class="glass rounded-2xl px-4 py-2.5 hover:bg-purple-100/50 dark:hover:bg-purple-900/30 transition-all duration-300 flex items-center gap-2 text-sm font-medium dark:text-white border border-transparent hover:border-purple-300/40">
                        ← Back to Topics
                    </button>
                    <div class="flex gap-2 flex-wrap" id="actionButtons"></div>
                </div>
                <div id="mindmapContent" class="glass-strong rounded-3xl p-4 md:p-8 min-h-[70vh] overflow-auto scrollbar-thin transition-all"></div>
            </div>

            <!-- ─── Quiz Modal ─── -->
            <div id="quizModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                <div class="glass-strong rounded-3xl p-6 md:p-8 max-w-lg w-full max-h-[85vh] overflow-y-auto scrollbar-thin bounce-in">
                    <div class="flex justify-between items-center mb-4"><h3 class="text-xl font-bold dark:text-white">📝 Quick Quiz</h3><button onclick="closeQuiz()" class="text-gray-400 hover:text-red-500 text-2xl transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 dark:hover:bg-red-900/20">✕</button></div>
                    <div id="quizContent"></div>
                </div>
            </div>

            <!-- ─── Flashcard Modal ─── -->
            <div id="flashcardModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
                <div class="glass-strong rounded-3xl p-6 md:p-8 max-w-md w-full bounce-in">
                    <button onclick="closeFlashcard()" class="float-right text-gray-400 hover:text-red-500 text-2xl transition-colors w-8 h-8 flex items-center justify-center rounded-full hover:bg-red-50 dark:hover:bg-red-900/20">✕</button>
                    <div id="flashcardContent" class="mt-2"></div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        //  DATA
        // ═══════════════════════════════════════════════════════════════

        const prepositionData = {
            'AT': {
                id: 'AT',
                color: 'from-purple-600 to-violet-500',
                bgColor: 'bg-purple-100/60 dark:bg-purple-900/30',
                textColor: 'text-purple-700 dark:text-purple-300',
                icon: '📍',
                definition: { en: 'Used for specific points in time or precise locations.', ar: 'تُستخدم للإشارة إلى نقطة زمنية محددة أو موقع دقيق.' },
                sections: {
                    'Time': { icon: '🕐', items: [{ en: 'at 7 o\'clock', ar: 'في الساعة السابعة', note: 'Specific clock time' },
                            { en: 'at noon', ar: 'عند الظهر', note: 'Fixed time of day' }, { en: 'at midnight',

                                ar: 'عند غروب الشمس', note: 'Natural event time' }, { en: 'at the moment',
                                ar: 'في هذه اللحظة', note: 'Current instant' }] },
                    'Places': { icon: '🏫', items: [{ en: 'at school', ar: 'في المدرسة', note: 'General location' },
                            { en: 'at work', ar: 'في الع
